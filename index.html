<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cut the Monolith</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<style>
/* One column, top to bottom: title; the colours (sticky at the top while you scroll), one colour per microservice;
   the 23 classes as one alphabetical list; the sticky bottom bar with progress, your name and Send.
   Every visit starts empty. No scores are shown: they are computed and sent to the class board only. */
:root {
	--ink: #1d2a44; --muted: #667085; --faint: #98a2b3; --line: #e4e7ec; --soft: #f6f7f9; --paper: #ffffff;
	--accent: #d62839; --ok: #1f9e89;
	--ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
	color-scheme: light;
}
* { box-sizing: border-box }
html { background: var(--paper); -webkit-text-size-adjust: 100% }
body { background: var(--paper); color: var(--ink); font: 16px/1.45 var(--ui); margin: 0; -webkit-tap-highlight-color: transparent }
button, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--ink) 55%, transparent); outline-offset: 2px }
.col { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* title */
.top { padding-top: 18px; padding-bottom: 4px }
.hrow { display: flex; gap: 12px; align-items: center; justify-content: space-between }
.top h1 { font-size: 26px; line-height: 1.15; letter-spacing: -0.01em; margin: 0; font-weight: 700 }
.top p { margin: 4px 0 0; color: var(--muted); font-size: 15px; max-width: 52ch }
.ghost { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 500; white-space: nowrap; flex: none }
.ghost:hover { border-color: var(--faint) }

/* the colours: one per microservice, then + */
.palette { position: sticky; top: 0; z-index: 5; background: var(--paper); padding-top: 12px; padding-bottom: 10px }
.palette.stuck { box-shadow: 0 6px 14px -12px rgba(29, 42, 68, 0.45) }
.svcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px }
.svc { position: relative; display: flex; min-width: 0 }
.pick { flex: 1; min-width: 0; min-height: 52px; display: flex; align-items: center; gap: 8px; padding: 6px 12px;
	border: 2px solid var(--c); background: var(--t); color: var(--ink); border-radius: 14px; text-align: left }
.pick .mk { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c) }
.pick .nm { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pick[aria-pressed="true"] { background: var(--c); color: #fff; box-shadow: 0 2px 8px -3px var(--c) }
.pick[aria-pressed="true"] .mk { background: none; width: auto; height: auto; font-size: 14px; line-height: 1 }
.pick[aria-pressed="true"] .mk::before { content: '✓'; font-weight: 700 }
.svc.rm .pick { padding-right: 38px }
.x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent;
	font-size: 20px; line-height: 1; color: var(--muted) }
.pick[aria-pressed="true"] + .x { color: #fff }
.add { min-height: 52px; border: 2px dashed var(--line); background: var(--paper); border-radius: 14px; font-size: 26px; line-height: 1; color: var(--muted) }
.add:hover { border-color: var(--faint); color: var(--ink) }
.say { margin: 8px 2px 0; font-size: 14px; color: var(--muted); min-height: 20px }
.say b { color: var(--ink); font-weight: 600 }

/* the classes */
.grid { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.cls { position: relative; min-height: 58px; padding: 8px 12px 8px 14px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px;
	text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px;
	-webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation }
.cls .nm { font-size: 15px; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere }
.cls .tg { font-size: 12.5px; font-weight: 600; line-height: 1.2; color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cls .tg:empty { display: none }
.cls.on { border-color: var(--c); background: var(--t); box-shadow: inset 5px 0 0 var(--c) }
.cls:not(.on):hover { border-color: var(--faint) }
@media (prefers-reduced-motion: no-preference) {
	.cls, .pick { transition: background-color 120ms, border-color 120ms, transform 90ms }
	.cls:active, .pick:active, .add:active { transform: scale(0.97) }
	.cls.pop { animation: pop 220ms ease-out }
	@keyframes pop { 40% { transform: scale(1.04) } }
}
.tip { margin: 18px 2px 0; font-size: 13.5px; color: var(--faint) }
.primary { border: 0; background: var(--ink); color: #fff; border-radius: 12px; min-height: 48px; padding: 0 20px; font-weight: 600 }

/* the bottom bar */
.bar { position: sticky; bottom: 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--line); margin-top: 28px;
	padding-bottom: env(safe-area-inset-bottom, 0px) }
.prog { height: 3px; background: var(--line) }
.prog i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 200ms }
.prog.done i { background: var(--ok) }
.bar .col { padding-top: 10px; padding-bottom: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px }
.send { display: flex; align-items: center; gap: 8px }
.count { flex: none; min-width: 64px; line-height: 1.1 }
.count b { display: block; font-size: 19px; font-variant-numeric: tabular-nums }
.count span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap }
.count.ok span { color: var(--ok); font-weight: 600 }
.team { flex: 1; width: 0; min-width: 0; min-height: 46px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--paper); font-size: 16px }
.team:focus { border-color: var(--ink); outline: none }
.go { flex: none; min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 16px }
.go[disabled] { opacity: 0.6 }
.msg { margin: 0; font-size: 14px }
.msg:empty { display: none }
.msg.bad { color: var(--accent) } .msg.good { color: var(--ok) }

/* bottom sheet (the guide, a class's dependencies) */
dialog.sheet { border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 85vh; margin: auto auto 0; border-radius: 20px 20px 0 0; background: var(--paper); color: var(--ink);
	box-shadow: 0 -10px 40px rgba(29, 42, 68, 0.18) }
@media (min-width: 700px) { dialog.sheet { margin: auto; border-radius: 20px } }
dialog.sheet::backdrop { background: rgba(29, 42, 68, 0.32) }
.sheet .in { padding: 20px 20px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px }
.sheet h2 { margin: 0; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere }
.sheet p { margin: 0; color: var(--muted) }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end }
.sheet h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint) }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 16px }
.steps li { display: flex; gap: 12px; align-items: center }
.steps .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; background: var(--soft) }
.deps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px }
.deps li { display: flex; align-items: center; gap: 10px; font-size: 15px }
.deps .sw { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c, transparent); border: 1.5px solid var(--c, var(--faint)) }
.deps .where { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(120px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: #fff;
	border-radius: 12px; padding: 6px 6px 6px 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(29, 42, 68, 0.25) }
.toast button { border: 0; background: rgba(255, 255, 255, 0.16); color: #fff; border-radius: 9px; min-height: 36px; padding: 0 12px; font-weight: 600 }
body.locked .add, body.locked .x, body.locked #reset { display: none }
body.locked .go { background: var(--ok); opacity: 1 }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
</style>
</head>
<body>


<header class="col top">
	<div class="hrow">
		<h1>Cut the Monolith</h1>
		<button class="ghost" id="reset">Start over</button>
	</div>
	<p>Split Spring PetClinic's 23 classes into microservices you would defend.</p>
</header>

<section class="palette" id="palette" aria-labelledby="h-svcs">
	<div class="col">
		<h2 class="sr" id="h-svcs">Your microservices</h2>
		<div class="svcs" id="svcs"></div>
		<p class="say" id="say" aria-live="polite"></p>
	</div>
</section>

<main class="col grid" id="classes" aria-label="The 23 classes"></main>
<p class="col tip">Press and hold a class (or right-click it) to see what it depends on.</p>

<div class="bar" id="bar">
	<div class="prog" id="prog" aria-hidden="true"><i></i></div>
	<div class="col">
		<p class="msg" id="send-msg" aria-live="polite"></p>
		<div class="send">
			<div class="count" id="count" aria-live="polite"><b>0/23</b><span>placed</span></div>
			<label class="sr" for="group">Your name</label>
			<input class="team" id="group" maxlength="30" placeholder="Your name" autocomplete="off" enterkeyhint="send">
			<button class="go" id="send">Send</button>
		</div>
	</div>
</div>

<dialog class="sheet" id="sheet"><div class="in" id="sheet-in"></div></dialog>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button id="toast-undo">Undo</button></div>

<script>
const DATA = {"classes":["PetClinicRuntimeHints","PetClinicApplication","Vet","Specialty","VetController","VetRepository","Vets","Pet","VisitController","PetTypeFormatter","OwnerRepository","OwnerController","PetController","PetValidator","Owner","Visit","PetType","WelcomeController","CacheConfiguration","CrashController","BaseEntity","Person","NamedEntity"],"packages":{"PetClinicApplication":"petclinic","PetClinicRuntimeHints":"petclinic","BaseEntity":"model","NamedEntity":"model","Person":"model","Owner":"owner","OwnerController":"owner","OwnerRepository":"owner","Pet":"owner","PetController":"owner","PetType":"owner","PetTypeFormatter":"owner","PetValidator":"owner","Visit":"owner","VisitController":"owner","CacheConfiguration":"system","CrashController":"system","WelcomeController":"system","Specialty":"vet","Vet":"vet","VetController":"vet","VetRepository":"vet","Vets":"vet"},"edges":[["NamedEntity","BaseEntity",1],["Person","BaseEntity",1],["Owner","Person",1],["Owner","Pet",6],["OwnerController","Owner",7],["OwnerController","OwnerRepository",6],["Pet","NamedEntity",1],["PetController","OwnerRepository",5],["PetController","Owner",6],["PetController","Pet",4],["PetController","PetValidator",1],["PetType","NamedEntity",1],["PetTypeFormatter","OwnerRepository",1],["PetTypeFormatter","PetType",2],["PetValidator","Pet",4],["Visit","BaseEntity",1],["VisitController","Owner",2],["VisitController","OwnerRepository",2],["VisitController","Pet",1],["VisitController","Visit",1],["Specialty","NamedEntity",1],["Vet","Person",1],["VetController","VetRepository",2],["VetController","Vets",4]],"reference":{"customers":["BaseEntity","NamedEntity","Owner","OwnerController","OwnerRepository","Person","Pet","PetClinicApplication","PetController","PetType","PetValidator"],"uncounted":["CrashController","PetClinicRuntimeHints","PetTypeFormatter","WelcomeController"],"vets":["CacheConfiguration","PetClinicApplication","Specialty","Vet","VetController","VetRepository","Vets","BaseEntity","NamedEntity","Person"],"visits":["BaseEntity","NamedEntity","Person","PetClinicApplication","Visit","VisitController"]},"tables":{"OWNERS":["Owner","OwnerController","OwnerRepository","PetController","VisitController"],"PETS":["Owner","OwnerController","OwnerRepository","Pet","PetController","PetValidator","VisitController"],"SPECIALTIES":["Specialty"],"TYPES":["OwnerRepository","Pet","PetController","PetType","PetTypeFormatter","PetValidator"],"VET_SPECIALTIES":["Vet"],"VETS":["Vet","VetController","VetRepository","Vets"],"VISITS":["Owner","Pet","Visit","VisitController"]},"usecases":{"Owner":["BaseEntity","NamedEntity","Owner","OwnerController","Person","Pet","Visit"],"Pet":["BaseEntity","NamedEntity","Owner","Person","Pet","PetController","PetTypeFormatter","PetValidator"],"Visit":["BaseEntity","NamedEntity","Owner","Person","Pet","Visit","VisitController"],"Vet":["BaseEntity","NamedEntity","Person","Vet","VetController","Vets"]},"workflow":{"OwnerPetVisitService":["Owner","OwnerController","OwnerRepository","Pet","PetController","PetType","PetTypeFormatter","PetValidator","VisitController"],"VetService":["VetController","VetRepository","Vets"],"SystemInfrastructureService":["PetClinicApplication","PetClinicRuntimeHints","CacheConfiguration","WelcomeController","CrashController"],"DomainFoundationService":["BaseEntity","NamedEntity","Person","Vet","Specialty","Visit"]},"workflowMetrics":{"CiD":100,"CMod":66.83673469387756,"TC":27.22556492736575,"LC":31.213141657459865,"c2c_cvg 10%":100,"c2c_cvg 33%":75,"c2c_cvg 50%":75,"DTP":83.93328158231976,"DI":33.40265960365654,"BCP":33.333333333333336,"partition_count":4,"completeness":100}}
DATA.edges = DATA.edges.map(([a, b, w]) => [a, b, 'dep', w]) // the benchmark graph: [from, to, weight]

// ---------------------------------------------------------------- metrics (same definitions as the study's code)
function ownerOf(dec) { const o = {}; for (const [s, cs] of Object.entries(dec)) for (const c of cs) o[c] = s; return o }
function cmod(dec) {
	const own = ownerOf(dec), names = Object.keys(dec); if (!names.length) return 0
	let cf = 0
	for (const n of names) {
		const set = new Set(dec[n]); let i = 0, e = 0
		for (const [s, t, , w = 1] of DATA.edges) { if (!(s in own) || !(t in own)) continue; if (set.has(s) && set.has(t)) i += w; else if (set.has(s) || set.has(t)) e += w }
		cf += i > 0 ? (2 * i) / (2 * i + e) : 0
	}
	return (cf / names.length) * 100
}
function cid(dec) {
	const own = ownerOf(dec), names = Object.keys(dec), dep = new Set()
	for (const [s, t] of DATA.edges) if (s in own && t in own && own[s] !== own[t]) dep.add(own[s] + '→' + own[t])
	let total = 0, cyc = 0, pairs = []
	for (const a of names) for (const b of names) { if (a === b) continue; total++; if (dep.has(a + '→' + b) && dep.has(b + '→' + a)) { cyc++; if (a < b) pairs.push([a, b]) } }
	return { value: total ? 100 - (cyc / total) * 100 : 100, pairs }
}
function overlap(a, b) { const B = new Set(b); return a.filter((x) => B.has(x)).length / Math.max(a.length, b.length) }
function c2c(dec, th) {
	const rows = Object.entries(dec); if (!rows.length) return 0
	return (rows.filter(([, cs]) => Object.values(DATA.reference).some((r) => overlap(cs, r) > th)).length / rows.length) * 100
}
function clippedEntropy(counts) {
	const n = counts.reduce((a, b) => a + b, 0); if (!n) return 0
	return Math.min(1, -counts.filter((c) => c > 0).reduce((s, c) => s + (c / n) * Math.log(c / n), 0))
}
// DTP (tables) and DI (use cases): how spread each label's classes are across services.
function labelPurity(dec, labels) {
	const own = ownerOf(dec), rows = Object.values(labels).map((cs) => {
		const per = {}; for (const c of new Set(cs)) if (c in own) per[own[c]] = (per[own[c]] ?? 0) + 1
		return clippedEntropy(Object.values(per))
	})
	return (1 - rows.reduce((s, h) => s + h, 0) / rows.length) * 100
}
// BCP: how many different use cases each service's classes take part in.
function bcp(dec, labels) {
	const byClass = {}; for (const [l, cs] of Object.entries(labels)) for (const c of new Set(cs)) (byClass[c] ??= []).push(l)
	const hs = []
	for (const cs of Object.values(dec)) {
		const uses = cs.flatMap((c) => byClass[c] ?? []); if (!uses.length) continue
		const counts = {}; for (const u of uses) counts[u] = (counts[u] ?? 0) + 1
		hs.push(clippedEntropy(Object.values(counts)))
	}
	return hs.length ? (1 - hs.reduce((a, b) => a + b, 0) / hs.length) * 100 : 0
}

// ---------------------------------------------------------------- state
// A microservice is just a colour; its name on the board is the colour's name. Every visit starts empty.
// colours: the deck's teal, blue, violet, amber, crimson, then slate, green, plum (darkened where white text sits on them)
const PALETTE = ['#1a8a78', '#2f6fae', '#7a5ba8', '#a86f00', '#d62839', '#4f5d75', '#3f7d2c', '#a8407a']
const HUES = ['Teal', 'Blue', 'Violet', 'Amber', 'Red', 'Slate', 'Green', 'Plum']
const MAX = PALETTE.length
function tint(hex, a = 0.12) { const n = parseInt(hex.slice(1), 16), m = (v) => Math.round(255 - (255 - v) * a); return `rgb(${m(n >> 16)}, ${m((n >> 8) & 255)}, ${m(n & 255)})` }
const fresh = () => ({ services: [{ name: HUES[0], color: 0, classes: [] }], unassigned: [...DATA.classes], sel: 0 })
let state = fresh()
const colorOf = (s) => PALETTE[s.color]
function freeColor() { const used = new Set(state.services.map((s) => s.color)); for (let i = 0; i < MAX; i++) if (!used.has(i)) return i; return -1 }
function decomposition() { const d = {}; for (const s of state.services) if (s.classes.length) d[s.name] = s.classes; return d }
function unassigned() { return state.unassigned }
function ownerIndex(c) { return state.services.findIndex((s) => s.classes.includes(c)) }
function currentScores() {
	const dec = decomposition(), n = Object.keys(dec).length
	const valid = unassigned().length === 0 && n >= 3 && state.services.every((x) => x.classes.length > 0)
	if (!n) return { valid, n, cmod: 0, cid: 0, dtp: 0, di: 0, bcp: 0, c2c: 0 }
	return { valid, n, cmod: cmod(dec), cid: cid(dec).value, dtp: labelPurity(dec, DATA.tables), di: labelPurity(dec, DATA.usecases), bcp: bcp(dec, DATA.usecases), c2c: c2c(dec, 0.5) }
}
// what Send posts to the class board
function payload(group) { return { room: ROOM, group, kind: 'hand', services: decomposition(), unassigned: unassigned().length, scores: currentScores(), device: DEVICE } }
// the rules a cut must meet to be ranked on the board: short words for the bar, a sentence for the message
function problems() {
	const out = [], left = unassigned().length, n = Object.keys(decomposition()).length, empty = state.services.filter((s) => !s.classes.length)
	if (left) out.push([`${left} to go`, `${left} class${left > 1 ? 'es are' : ' is'} not in a microservice yet`])
	if (n < 3) out.push(['need 3+ colours', `only ${n} colour${n === 1 ? ' has' : 's have'} classes; a valid cut needs at least three microservices`])
	if (empty.length) out.push(['empty colour', `${empty[0].name} is empty: tap classes into it, or remove it with ×`])
	return out
}

// ---------------------------------------------------------------- the classes: one alphabetical list, built once, then updated in place
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')
const camel = (c) => esc(c).replace(/([a-z])([A-Z])/g, '$1<wbr>$2')
const chip = {}
$('classes').innerHTML = DATA.classes.slice().sort().map((c) => `<button class="cls" data-c="${c}"><span class="nm">${camel(c)}</span><span class="tg"></span></button>`).join('')
for (const b of document.querySelectorAll('.cls')) chip[b.dataset.c] = b

// ---------------------------------------------------------------- render
let armed = false // an invalid cut needs a second tap on Send
function render() {
	const sel = state.services[state.sel], removable = state.services.length > 1
	$('svcs').innerHTML = state.services.map((s, i) => {
		const rm = removable && !s.classes.length
		return `<div class="svc${rm ? ' rm' : ''}" style="--c:${colorOf(s)};--t:${tint(colorOf(s))}"><button class="pick" data-s="${i}" aria-pressed="${i === state.sel}"
			aria-label="${s.name}, ${s.classes.length} class${s.classes.length === 1 ? '' : 'es'}"><span class="mk" aria-hidden="true"></span><span class="nm">${s.name}</span></button>${
			rm ? `<button class="x" data-x="${i}" aria-label="Remove ${s.name}">×</button>` : ''}</div>`
	}).join('') + (state.services.length < MAX ? '<button class="add" id="add" aria-label="New microservice">+</button>' : '')
	$('say').innerHTML = locked ? 'Your cut has been sent.' : `Tapping a class puts it in <b>${sel.name}</b> (${sel.classes.length}) · <b>+</b> starts a new microservice`
	for (const c of DATA.classes) {
		const b = chip[c], s = state.services[ownerIndex(c)]
		b.classList.toggle('on', !!s)
		if (s) { b.style.setProperty('--c', colorOf(s)); b.style.setProperty('--t', tint(colorOf(s), 0.1)) }
		b.querySelector('.tg').textContent = s ? s.name : ''
		b.setAttribute('aria-label', `${c}, ${s ? 'in ' + s.name : 'not placed'}`)
	}
	const placed = DATA.classes.length - unassigned().length, issues = problems()
	$('prog').firstElementChild.style.width = (placed / DATA.classes.length) * 100 + '%'
	$('prog').classList.toggle('done', !issues.length)
	$('count').classList.toggle('ok', !issues.length)
	$('count').innerHTML = `<b>${placed}/${DATA.classes.length}</b><span>${issues.length ? issues[0][0] : '✓ ready'}</span>`
	$('send').textContent = locked ? 'Sent ✓' : armed ? 'Send anyway' : 'Send'
	if (locked) { $('send').disabled = true; $('group').disabled = true }
}
function changed() { armed = false; setMsg('', ''); render() }

// ---------------------------------------------------------------- painting
function paint(c) {
	if (locked) return
	const s = state.services[state.sel], back = s.classes.includes(c)
	for (const x of state.services) x.classes = x.classes.filter((y) => y !== c)
	state.unassigned = state.unassigned.filter((y) => y !== c)
	if (back) state.unassigned.push(c); else s.classes.push(c)
	try { navigator.vibrate?.(8) } catch {}
	changed()
	const b = chip[c]; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop')
}
function addService() {
	if (locked) return
	const color = freeColor(); if (color < 0) return
	state.services.push({ name: HUES[color], color, classes: [] })
	state.sel = state.services.length - 1
	changed()
}
function removeService(i) {
	if (locked || state.services.length < 2 || state.services[i].classes.length) return
	state.services.splice(i, 1)
	if (state.sel >= i && state.sel > 0) state.sel--
	changed()
}
function startOver() {
	if (locked || state.unassigned.length === DATA.classes.length && state.services.length === 1) return
	const before = JSON.stringify(state)
	state = fresh(); changed()
	toast('Cleared', () => { state = JSON.parse(before); changed() })
}

// ---------------------------------------------------------------- sheets
const sheet = $('sheet'); let openedAt = 0
function openSheet(html) {
	$('sheet-in').innerHTML = html
	if (!sheet.open) { sheet.showModal(); openedAt = Date.now() }
}
function closeSheet() { if (sheet.open) sheet.close() }
sheet.addEventListener('click', (e) => { if (e.target === sheet && Date.now() - openedAt > 400) closeSheet() }) // tap on the backdrop
$('sheet-in').addEventListener('click', (e) => { if (e.target.closest('[data-act="close"]')) closeSheet() })
function guide() {
	openSheet(`<h2>How to play</h2><ul class="steps">
		<li><span class="ic" style="background:${tint(PALETTE[0], 0.18)};color:${PALETTE[0]}">●</span><span>Each colour is one microservice.</span></li>
		<li><span class="ic" style="background:#fff;border:1.5px solid var(--line);box-shadow:inset 5px 0 0 #1a8a78"></span><span>Tap a class to put it in the selected colour. Tap it again to take it out.</span></li>
		<li><span class="ic">+</span><span>Press <b>+</b> to start a new microservice.</span></li></ul>
		<div class="acts"><button class="primary" data-act="close">Got it</button></div>`)
}
function depsSheet(c) {
	const uses = DATA.edges.filter(([s]) => s === c).map(([, t, , w]) => [t, w]).sort((a, b) => b[1] - a[1])
	const usedBy = DATA.edges.filter(([, t]) => t === c).map(([s, , , w]) => [s, w]).sort((a, b) => b[1] - a[1])
	const me = state.services[ownerIndex(c)]
	const item = ([x, w]) => { const s = state.services[ownerIndex(x)]
		return `<li><span class="sw" style="${s ? `--c:${colorOf(s)}` : ''}" aria-hidden="true"></span><span>${esc(x)}${w > 1 ? ` <small style="color:var(--faint)">×${w}</small>` : ''}</span><span class="where">${s ? s.name : 'not placed'}</span></li>` }
	const list = (title, xs) => xs.length ? `<div><h3>${title}</h3><ul class="deps">${xs.map(item).join('')}</ul></div>` : ''
	openSheet(`<h2>${camel(c)}</h2><p>${me ? 'Now in <b>' + me.name + '</b>' : 'Not placed yet'}</p>
		${list('It uses', uses)}${list('Used by', usedBy)}${uses.length || usedBy.length ? '' : '<p>No static dependencies in either direction.</p>'}
		<p style="font-size:13.5px">×n: how strong the dependency is.</p>
		<div class="acts"><button class="primary" data-act="close">Close</button></div>`)
}
let toastTimer = 0
function toast(text, undo) {
	$('toast-text').textContent = text; $('toast').hidden = false
	$('toast-undo').onclick = () => { $('toast').hidden = true; if (!locked) undo() }
	clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true }, 5000)
}

// ---------------------------------------------------------------- input: tap paints; press-and-hold (or right-click) shows dependencies
let hold = 0, held = false, start = null
$('classes').addEventListener('pointerdown', (e) => {
	const b = e.target.closest('.cls'); if (!b) return
	held = false; start = [e.clientX, e.clientY]; clearTimeout(hold)
	hold = setTimeout(() => { held = true; try { navigator.vibrate?.(15) } catch {} depsSheet(b.dataset.c) }, 480)
})
const cancelHold = () => clearTimeout(hold)
$('classes').addEventListener('pointerup', cancelHold)
$('classes').addEventListener('pointercancel', cancelHold)
$('classes').addEventListener('pointermove', (e) => { if (start && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 10) cancelHold() })
$('classes').addEventListener('contextmenu', (e) => { const b = e.target.closest('.cls'); if (!b) return; e.preventDefault(); cancelHold(); if (!sheet.open) depsSheet(b.dataset.c); held = true })
$('classes').addEventListener('click', (e) => {
	const b = e.target.closest('.cls'); if (!b) return
	if (held) { held = false; return }
	paint(b.dataset.c)
})
$('svcs').addEventListener('click', (e) => {
	if (e.target.closest('#add')) return addService()
	const x = e.target.closest('[data-x]'); if (x) return removeService(+x.dataset.x)
	const b = e.target.closest('[data-s]'); if (!b) return
	const i = +b.dataset.s
	if (i !== state.sel) { state.sel = i; render(); $('svcs').querySelector(`[data-s="${i}"]`)?.focus() }
})
$('reset').onclick = startOver
new IntersectionObserver(([en]) => $('palette').classList.toggle('stuck', !en.isIntersecting), { threshold: 0 }).observe(document.querySelector('.top'))

// ---------------------------------------------------------------- the class board
const BOARD = 'https://cut-the-monolith-board.sambuaneesh.workers.dev', ROOM = 'nov12'
// one cut per device and room: a random device id goes with the cut (the board refuses a second one with 409),
// and after a send the page stays locked on this phone
let locked = false, DEVICE = ''
try { DEVICE = localStorage.getItem('ctm-device') || '' } catch {}
if (!DEVICE) {
	try { DEVICE = crypto.randomUUID() } catch { DEVICE = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + Date.now().toString(36) }
	try { localStorage.setItem('ctm-device', DEVICE) } catch {}
}
function lock(group, text, cls) {
	try { localStorage.setItem('ctm-sent-' + ROOM, group) } catch {}
	locked = true; armed = false; $('toast').hidden = true; document.body.classList.add('locked'); render(); setMsg(text, cls)
}
function setMsg(text, cls) { $('send-msg').textContent = text; $('send-msg').className = 'msg ' + cls }
try { $('group').value = localStorage.getItem('cut-group') || '' } catch {}
$('group').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('send').click() })
$('send').onclick = async () => {
	const group = $('group').value.trim().slice(0, 30)
	if (!group) { setMsg('Type your name first, so you can find yourself on the board.', 'bad'); $('group').focus(); return }
	try { localStorage.setItem('cut-group', group) } catch {}
	const issues = problems()
	if (issues.length && !armed) { armed = true; render(); setMsg(`Not a valid cut yet: ${issues[0][1]}. Tap “Send anyway” to send it as it is.`, 'bad'); return }
	if (!BOARD.startsWith('http')) { setMsg('The class board is not switched on yet.', 'bad'); return }
	setMsg('Sending…', ''); $('send').disabled = true
	try {
		const r = await fetch(BOARD + '/cuts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload(group)) })
		if (r.status === 409) return lock(group, 'This device has already sent a cut.', 'bad')
		if (!r.ok) throw new Error(await r.text())
		lock(group, 'Your cut is on the board. One cut per person.', 'good')
	} catch (err) { setMsg('Could not send: ' + (err.message || 'network error') + '. Try again.', 'bad') }
	finally { $('send').disabled = locked }
}

render()
let sentAs = null
try { sentAs = localStorage.getItem('ctm-sent-' + ROOM) } catch {}
if (sentAs !== null) { $('group').value = sentAs; lock(sentAs, 'Your cut is on the board. One cut per person.', 'good') } else guide()
</script>

</body>
</html>
