<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Board · Cut the Monolith</title>
<meta name="theme-color" content="#ffffff">
<style>
/* Layout: a projector page (shown in an 1800×1000 frame that cannot scroll), white like the playground.
   The heading; then every valid player ranked by the score, flowing into columns; next to it, only when someone broke
   the rules, the rule-breakers with the reason. The row height shrinks so everyone fits. */
:root {
	--bg: #ffffff; --ink: #1d2a44; --muted: #667085; --faint: #98a2b3; --line: #e4e7ec; --soft: #f6f7f9;
	--gold: #fbf3dc; --bad: #d62839;
	--display: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
	--rh: 56px; --srh: 52px;
	color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--bg) }
body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--display); line-height: 1.2;
	padding: 24px max(32px, env(safe-area-inset-right, 0px)) 24px max(32px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px }
h1 { font: 700 48px/1.05 var(--display); margin: 0; letter-spacing: -0.02em; flex: none }
.boards { flex: 1; min-height: 0; display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr) }
.boards.two { grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) }
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px }
.panel h2 { font: 700 30px var(--display); margin: 0; flex: none }
.cols.one { max-width: 980px }
.cols { display: grid; gap: 0 32px; align-items: start; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)) }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed }
th, td { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
th { font-size: 16px; font-weight: 600; color: var(--muted); padding: 0 10px 6px; border-bottom: 2px solid var(--line) }
td { border-bottom: 1px solid var(--line); padding: 0 10px }
td.n, th.n { text-align: right }
.lb td { height: var(--rh); font-size: calc(var(--rh) * 0.46) }
.lb col.rk { width: calc(var(--rh) * 1.2) } .lb col.sc { width: calc(var(--rh) * 2) }
.lb th { font-size: 16px }
.lb td.rk { color: var(--muted); font-weight: 600 }
.lb tr.top td { background: var(--gold); font-weight: 700; font-size: calc(var(--rh) * 0.56) }
.lb tr.top td.rk { font-size: calc(var(--rh) * 0.62); color: inherit }
.lb tr.top + tr:not(.top) td { border-top: 2px solid var(--line) }
.empty { font-size: 34px; color: var(--muted); padding: 30px 4px }
.shame h2 { color: var(--bad) }
.shame .box { border: 2px solid color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius: 18px; padding: 6px 16px 8px; background: color-mix(in srgb, var(--bad) 3%, #fff) }
.shame td { height: var(--srh); font-size: calc(var(--srh) * 0.44) }
.shame td.why { white-space: normal; color: var(--bad); font-size: calc(var(--srh) * 0.38); line-height: 1.15; padding-top: 4px; padding-bottom: 4px }
.shame col.why { width: 56% }
.shame tr:last-child td { border-bottom: 0 }
.shame .more td { color: var(--muted); font-size: 20px; height: auto; padding-top: 8px }
.upd { position: fixed; right: 14px; bottom: 8px; font-size: 12px; color: var(--faint) }
</style>
</head>
<body>
<h1>Class board</h1>
<div class="boards" id="boards">
	<section class="panel lb" aria-label="Leaderboard"><div id="lb"></div></section>
	<section class="panel shame" aria-labelledby="h-shame" id="shame" hidden>
		<h2 id="h-shame">Thought you could get away with this??</h2>
		<div class="box" id="shame-list"></div>
	</section>
</div>
<div class="upd" id="upd"></div>
<script>
const BOARD = 'https://cut-the-monolith-board.sambuaneesh.workers.dev', ROOM = new URLSearchParams(location.search).get('room') || 'nov12'
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;')
// the score is CMod, rounded to one decimal (ties are judged on what is shown)
const score = (r) => { const v = Number(r.scores?.cmod); return Number.isFinite(v) ? Math.round(v * 10) / 10 : null }
const fmt = (v) => v.toFixed(1)
let rows = []

// one entry per phone: the latest cut of each device (or of each name, for a cut without a device);
// different phones with the same name become "Rahul" and "Rahul (2)"
function entries(raw) {
	const latest = new Map()
	for (const x of raw) {
		if (!x || typeof x !== 'object' || !x.scores) continue
		const key = x.device ? 'd:' + x.device : 'g:' + String(x.group ?? '').trim().toLowerCase()
		const o = latest.get(key)
		if (!o || Number(x.at) > Number(o.at)) latest.set(key, x)
	}
	const out = [...latest.values()].sort((a, b) => Number(a.at) - Number(b.at)), seen = {}
	for (const r of out) {
		const base = String(r.group ?? '').trim() || 'no name', k = base.toLowerCase()
		seen[k] = (seen[k] ?? 0) + 1
		r.label = seen[k] > 1 ? `${base} (${seen[k]})` : base
	}
	return out
}

function why(r) {
	const n = Number(r.scores.n) || 0, left = Number(r.unassigned) || 0
	const svc = `${n} service${n === 1 ? '' : 's'}`, out = `${left} class${left === 1 ? '' : 'es'} left out`
	if (n === 0) return 'nothing placed'
	if (n === 1) return 'one service = the monolith 🙃'
	if (n < 3 && left) return `${svc}, ${out}`
	if (n < 3) return `only ${svc}`
	if (left) return out
	return 'an empty service'
}

// how many columns and how tall a row, so that everyone fits in the height that is there
function fit(n, height, two) {
	const cols = n <= 12 ? 1 : n <= 26 ? 2 : two || n <= 51 ? 3 : 4, per = Math.ceil(n / cols)
	return { cols, per, rh: Math.max(26, Math.min(64, Math.floor((height - 34) / per))) }
}

function draw() {
	const ok = rows.filter((r) => r.scores.valid && score(r) != null).sort((a, b) => score(b) - score(a) || Number(a.at) - Number(b.at))
	const bad = rows.filter((r) => !r.scores.valid).sort((a, b) => Number(a.at) - Number(b.at))
	$('shame').hidden = !bad.length
	$('boards').classList.toggle('two', bad.length > 0)
	const height = $('boards').clientHeight

	// the leaderboard: standard competition ranking (equal scores share the rank and the medal: 1, 1, 1, 4 …)
	if (!ok.length) $('lb').innerHTML = `<div class="empty">${rows.length ? 'No valid cuts yet…' : 'Waiting for the first cuts…'}</div>`
	else {
		let rank = 0
		const ranked = ok.map((r, i) => { if (i === 0 || score(r) !== score(ok[i - 1])) rank = i + 1; return [rank, r] })
		const { cols, per, rh } = fit(ranked.length, height, bad.length > 0)
		document.documentElement.style.setProperty('--rh', rh + 'px')
		const medal = (k) => ['🥇', '🥈', '🥉'][k - 1]
		let html = ''
		for (let c = 0; c < cols; c++) {
			const part = ranked.slice(c * per, (c + 1) * per); if (!part.length) break
			html += `<table><colgroup><col class="rk"><col><col class="sc"></colgroup><tr><th>#</th><th>player</th><th class="n">score</th></tr>` +
				part.map(([k, r]) => `<tr class="${k <= 3 ? 'top' : ''}"><td class="rk">${medal(k) ?? k}</td><td>${esc(r.label)}</td><td class="n">${fmt(score(r))}</td></tr>`).join('') + '</table>'
		}
		$('lb').innerHTML = `<div class="cols${cols === 1 ? ' one' : ''}" style="--cols:${cols}">${html}</div>`
	}

	// the rule-breakers: only when there are any; names and the reason, no scores
	if (bad.length) {
		const avail = height - 60, srh = Math.max(34, Math.min(56, Math.floor(avail / bad.length)))
		const fits = Math.max(1, Math.floor(avail / srh)), show = bad.length > fits ? fits - 1 : bad.length
		document.documentElement.style.setProperty('--srh', srh + 'px')
		$('shame-list').innerHTML = `<table><colgroup><col><col class="why"></colgroup>` +
			bad.slice(0, show).map((r) => `<tr><td>${esc(r.label)}</td><td class="why">${why(r)}</td></tr>`).join('') +
			(bad.length > show ? `<tr class="more"><td colspan="2">…and ${bad.length - show} more</td></tr>` : '') + '</table>'
	}
}

async function poll() {
	if (!BOARD.startsWith('http')) { $('upd').textContent = 'board not connected'; draw(); return }
	try {
		const r = await fetch(`${BOARD}/cuts?room=${encodeURIComponent(ROOM)}`, { cache: 'no-store' })
		if (!r.ok) throw new Error(r.status)
		const raw = await r.json()
		if (Array.isArray(raw)) rows = entries(raw)
		$('upd').textContent = 'updated ' + new Date().toLocaleTimeString()
	} catch (e) { $('upd').textContent = 'cannot reach the board, retrying…' }
	draw()
	setTimeout(poll, 3000)
}
addEventListener('resize', draw)
draw(); poll()
</script>
</body>
</html>
